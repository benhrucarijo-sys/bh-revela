<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#b8c4de"/><stop offset="1" stop-color="#3b4766"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3857"/><stop offset="1" stop-color="#0a0f1e"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f6fff"/><stop offset="1" stop-color="#7fe0ff"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="200" cy="246" rx="120" ry="9" fill="#000" opacity=".5"/>
<!-- coronha dobrável -->
<path d="M100 120 L140 120 L142 136 L102 138 Z" fill="url(#dark)" stroke="#7fe0ff" stroke-width="2"/>
<!-- corpo -->
<path d="M140 116 Q140 108 150 108 L262 108 Q272 108 272 118 L272 140 Q272 150 262 150 L150 150 Q140 150 140 140 Z" fill="url(#metal)" stroke="#1f2a44" stroke-width="2"/>
<rect x="146" y="114" width="122" height="5" rx="2.5" fill="url(#neon)" filter="url(#glow)"/>
<!-- ventilação -->
<path d="M160 128 L240 128 M160 136 L240 136" stroke="#2c3857" stroke-width="2" opacity=".6"/>
<!-- mira -->
<rect x="164" y="94" width="40" height="14" rx="3" fill="url(#dark)" stroke="#7fe0ff" stroke-width="1.5"/>
<rect x="170" y="98" width="28" height="3" fill="#7fe0ff" filter="url(#glow)"/>
<!-- cano longo -->
<rect x="270" y="118" width="70" height="16" rx="4" fill="url(#dark)" stroke="#4fc3ff" stroke-width="1.5"/>
<rect x="334" y="114" width="12" height="24" rx="3" fill="#050812" stroke="#4fc3ff" stroke-width="1.5"/>
<!-- pegada e carregador curto -->
<path d="M196 150 L220 150 L222 166 L194 166 Z" fill="url(#dark)" stroke="#4fc3ff" stroke-width="1.5"/>
<path d="M186 150 L208 150 L206 230 Q206 236 198 236 L192 236 Q186 236 186 230 Z" fill="url(#dark)" stroke="#4fc3ff" stroke-width="2"/>
<path d="M188 166 L206 166 M188 180 L206 180 M188 194 L206 194 M188 208 L206 208" stroke="#4fc3ff" stroke-width="1" opacity=".35"/>
<!-- empunhadura e gatilho -->
<path d="M160 150 L184 150 L178 196 Q176 204 168 202 L160 186 Z" fill="url(#dark)" stroke="#4fc3ff" stroke-width="2"/>
<path d="M172 162 Q180 172 170 180" fill="none" stroke="#4fc3ff" stroke-width="2"/>
</svg>
